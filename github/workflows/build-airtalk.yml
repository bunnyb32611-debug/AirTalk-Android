
name: Build AirTalk APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AirTalk-Android-Source-Build.zip'
      - '.github/workflows/build-airtalk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q AirTalk-Android-Source-Build.zip -d extracted-project
          test -f extracted-project/AirTalk/settings.gradle.kts

      - name: Build APK
        working-directory: extracted-project/AirTalk
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AirTalk-debug-apk
          path: extracted-project/AirTalk/app/build/outputs/apk/debug/app-debug.apk
          
